<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일 필수: 이 태그가 없으면 폰에서 PC용 화면처럼 축소되어 터치가 스크롤/확대로 해석됨 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />
    <title>Interactive Design (2)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #111;
        --paper: #fff;
        --gray: #f2f2f2;
        --accent: #33405f; /* 채도 낮은 남색 (뱃지 색) */
        --line: 1.5px solid var(--ink);
        --side: clamp(20px, 6vw, 80px); /* 화면 좌우 여백 */
        --col: 16px; /* 카드 안쪽 여백 (세로선과 글자 사이) */
        /* 뾰족한 끝이 16개인 별 모양 */
        --star: polygon(
          50% 0%,
          57.6% 11.7%,
          69.1% 3.8%,
          71.7% 17.6%,
          85.4% 14.6%,
          82.4% 28.3%,
          96.2% 30.9%,
          88.3% 42.4%,
          100% 50%,
          88.3% 57.6%,
          96.2% 69.1%,
          82.4% 71.7%,
          85.4% 85.4%,
          71.7% 82.4%,
          69.1% 96.2%,
          57.6% 88.3%,
          50% 100%,
          42.4% 88.3%,
          30.9% 96.2%,
          28.3% 82.4%,
          14.6% 85.4%,
          17.6% 71.7%,
          3.8% 69.1%,
          11.7% 57.6%,
          0% 50%,
          11.7% 42.4%,
          3.8% 30.9%,
          17.6% 28.3%,
          14.6% 14.6%,
          28.3% 17.6%,
          30.9% 3.8%,
          42.4% 11.7%
        );
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* 과제를 보고 있을 땐 뒤 페이지가 절대 스크롤되지 않게 고정
         (아이폰에서 터치가 페이지 스크롤로 새는 것 방지) */
      body.viewing {
        position: fixed;
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      /* ---------- 헤더 ---------- */
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 56px var(--side) 0;
      }

      .header-meta {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-align: left;
        line-height: 1.5;
        padding-top: 4px;
      }

      main {
        padding: 0 var(--side) 80px;
      }

      /* ---------- 섹션 제목 ---------- */
      .section-title {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 72px 0 0;
        padding-bottom: 18px;
        font-size: clamp(36px, 5vw, 56px);
        font-weight: 400;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        line-height: 1;
      }

      /* ---------- 별 뱃지 ----------
         별 모양은 ::before에 그리고, 글자(span)는 그 위에 올린다.
         그래서 별만 돌고 글자는 똑바로 있다. */
      .badge {
        position: relative;
        flex: none;
        display: inline-grid;
        place-items: center;
        width: 1em;
        height: 1em;
        color: var(--paper);
        font-size: 54px;
      }
      .badge::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--accent);
        clip-path: var(--star);
        transition: transform 0.6s ease;
      }
      .badge span {
        position: relative; /* 별 위에 글자 */
        font-size: 0.3em;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .section-title .badge {
        font-size: 1.05em;
      }
      /* 제목 옆 큰 별은 아주 천천히 회전 */
      .section-title .badge::before {
        animation: spin 24s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---------- 카드 그리드 ----------
         카드마다 위쪽 가로선 + 왼쪽 세로선.
         그리드를 왼쪽으로 살짝 밀어서 첫 번째 열의 세로선은 화면 밖으로 숨긴다. */
      .grid-wrap {
        overflow: hidden;
        border-bottom: var(--line);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        margin: 0 calc(var(--col) * -1);
      }
      .card {
        border-top: var(--line);
        padding: 26px 0 30px;
        cursor: pointer;
        color: inherit;
        text-decoration: none;
      }
      .card-inner {
        height: 100%;
        display: flex;
        flex-direction: column;
        border-left: var(--line);
        padding: 0 var(--col);
      }
      .card-title {
        margin: 0;
        min-height: 4.2em; /* 제목 3줄 높이를 맞춰서 카드끼리 줄이 맞게 */
        font-size: 21px;
        font-weight: 400;
        line-height: 1.3;
        text-transform: uppercase;
      }
      .card-meta {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end; /* 번호만 오른쪽에 */
        margin-top: auto;
        padding: 40px 0 8px;
      }
      .tags {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        letter-spacing: 0.04em;
        padding-bottom: 8px;
      }
      .tags .badge {
        font-size: 28px;
      }
      .card-num {
        font-size: clamp(44px, 5vw, 58px);
        font-weight: 400;
        letter-spacing: -0.03em;
        line-height: 0.85;
      }
      .thumb {
        position: relative;
        aspect-ratio: 3 / 2;
        background: var(--gray);
        overflow: hidden;
      }
      .thumb img {
        position: relative;
        z-index: 1; /* 썸네일이 있으면 번호 위를 덮음 */
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s ease;
      }
      /* 썸네일이 없을 때 회색 칸에 크게 번호 */
      .thumb .empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 64px;
        font-weight: 800;
        color: #fff;
        letter-spacing: -0.04em;
      }
      .card:hover .card-title {
        text-decoration: underline;
        text-underline-offset: 4px;
        text-decoration-thickness: 1.5px;
      }
      .card:hover .thumb img {
        transform: scale(1.03);
      }

      /* 아직 안 올라간 과제 */
      .card.soon {
        cursor: default;
      }
      .card.soon .card-title,
      .card.soon .card-num {
        color: #b5b5b5;
      }
      .card.soon .badge::before {
        background: #c4c8d2;
      }
      .card.soon:hover .card-title {
        text-decoration: none;
      }
      .card.soon:hover .tags .badge::before {
        transform: none;
      }

      /* 움직임 줄이기 설정을 켠 사람에게는 회전하지 않음 */
      @media (prefers-reduced-motion: reduce) {
        .badge::before {
          animation: none !important;
          transition: none;
        }
      }

      /* ---------- 과제 보기 화면 (전체 화면) ---------- */
      #viewer {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        background: var(--paper);
      }
      body.viewing #viewer {
        display: flex;
      }
      .bar {
        flex: none;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        height: 52px;
        padding: 0 20px;
        border-bottom: var(--line);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .bar button {
        all: unset;
        cursor: pointer;
        padding: 8px 0;
      }
      .bar button:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .bar .nav {
        justify-self: end;
        display: flex;
        gap: 18px;
      }
      .bar .now {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #frame {
        flex: 1;
        width: 100%;
        border: 0;
        display: block;
      }

      /* ---------- 반응형 ---------- */
      @media (max-width: 960px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 600px) {
        header {
          padding-top: 32px;
        }
        .section-title {
          margin-top: 48px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .card-title {
          min-height: 0;
        }
        .card-meta {
          padding-top: 24px;
        }
        .bar .now {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-meta">Interactive Design (2)<br />Archive</div>
    </header>

    <main>
      <h1 class="section-title">
        <span class="badge"><span>ID</span></span>
        Homework
      </h1>
      <div class="grid-wrap">
        <div class="grid" id="grid"></div>
      </div>
    </main>

    <!-- 과제 보기 화면 -->
    <div id="viewer">
      <div class="bar">
        <button onclick="closeHomework()">← Index</button>
        <div class="now" id="now"></div>
        <div class="nav">
          <button onclick="step(-1)">Prev</button>
          <button onclick="step(1)">Next</button>
        </div>
      </div>
      <iframe id="frame" title="homework"></iframe>
    </div>

    <script>
      // =====================================================
      // 과제 목록 — 새 과제가 생기면 여기에 한 줄만 추가하면 된다
      //   folder : 과제 폴더 이름 (그 안의 index.html을 연다)
      //   thumb  : 썸네일 이미지 (폴더 안의 thumb.png). 없으면 회색 칸으로 표시
      //   soon   : true면 아직 준비 중 (클릭 안 됨)
      // =====================================================
      const WORKS = [
        { num: "01", title: "Dynamic Balance", folder: "01 Dynamic Balance" },
        {
          num: "02",
          title: "Delete, Delete, Delete",
          folder: "02 Delete, delete, delete",
        },
        { num: "03", title: "Ostraca", folder: "Ostraca" },
      ];

      let current = -1;

      // 카드 만들기
      const grid = document.getElementById("grid");
      WORKS.forEach((w, i) => {
        const card = document.createElement("a");
        card.className = "card" + (w.soon ? " soon" : "");
        card.innerHTML = `
          <div class="card-inner">
            <h2 class="card-title">${w.title}</h2>
            <div class="card-meta">

              <div class="card-num">${w.num}</div>
            </div>
            <div class="thumb">
              <div class="empty">${w.num}</div>
              ${w.soon ? "" : `<img src="${w.folder}/thumb.png" alt="" onerror="this.remove()" />`}
            </div>
          </div>`;
        if (!w.soon) card.onclick = () => openHomework(i);
        grid.appendChild(card);
      });

      // 과제 열기 — iframe에 해당 폴더의 index.html을 불러옴
      function openHomework(i) {
        current = i;
        const w = WORKS[i];
        document.getElementById("frame").src = w.folder + "/index.html";
        document.getElementById("now").textContent = w.num + " — " + w.title;
        document.body.classList.add("viewing");
        history.replaceState(null, "", "#" + w.num); // 새로고침해도 이 과제가 열림
      }

      function closeHomework() {
        document.body.classList.remove("viewing");
        document.getElementById("frame").src = "about:blank"; // 과제 실행 멈춤
        history.replaceState(null, "", location.pathname);
        current = -1;
      }

      // 이전 / 다음 과제 (준비 중인 과제는 건너뜀)
      function step(dir) {
        const ready = WORKS.map((w, i) => i).filter((i) => !WORKS[i].soon);
        const pos = ready.indexOf(current);
        openHomework(ready[(pos + dir + ready.length) % ready.length]);
      }

      // 주소에 #02 처럼 번호가 있으면 그 과제를 바로 연다
      const start = WORKS.findIndex((w) => "#" + w.num === location.hash);
      if (start >= 0 && !WORKS[start].soon) openHomework(start);
    </script>
  </body>
</html>
